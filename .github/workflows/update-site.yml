# Rebuilds and publishes dralikaplan.com.
# Runs every Monday 07:00 (Türkiye), whenever something is pushed, or by hand
# from GitHub: Actions -> "Update site" -> "Run workflow".
name: Update site

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # to save refreshed data in content/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Projects and teaching from Avesis
        run: python3 tools/fetch_avesis.py

      - name: Publications (OpenAlex, ORCID, Crossref, Google Scholar)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 tools/fetch_publications.py

      - name: Build site
        run: python3 tools/build_site.py

      - name: Save refreshed data
        run: |
          git config user.name "site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publications.json content/projects.json content/teaching.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update publications and Avesis data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash && git push || echo "::warning::Could not save the refreshed data; the site is still published."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
